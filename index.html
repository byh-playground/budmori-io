<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
        <!-- bloom-pwa:start -->
        <link rel="manifest" href="manifest.webmanifest" />
        <meta name="theme-color" content="#e3ead6" />
        <meta name="description" content="Grow a little farm and take on giant neighbors." />
        <link rel="icon" type="image/png" sizes="192x192" href="pwa/icon-192.png" />
        <link rel="apple-touch-icon" href="pwa/apple-touch-icon.png" />
        <meta name="apple-mobile-web-app-title" content="budmori" />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://byh-playground.github.io/budmori-io/" />
        <meta property="og:title" content="BUDMORI · Little Farm, Giant Neighbors" />
        <meta property="og:description" content="Grow a little farm and take on giant neighbors." />
        <meta property="og:image" content="https://byh-playground.github.io/budmori-io/pwa/share.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta name="twitter:card" content="summary_large_image" />
        <!-- bloom-pwa:end -->
        <title>BUDMORI · Little Farm, Giant Neighbors</title>
        <link rel="stylesheet" href="./src/styles/tokens.css" />
        <link rel="stylesheet" href="./src/styles/base.css" />
        <link rel="stylesheet" href="./src/styles/home.css" />
        <link rel="stylesheet" href="./src/styles/tower.css" />
        <link rel="stylesheet" href="./src/styles/game-menu.css" />
        <link rel="stylesheet" href="./src/formation/formation-skills.css" />
        <link rel="stylesheet" href="./src/styles/boss-reward.css" />
        <link rel="stylesheet" href="./src/styles/boss-reward-dialog.css" />
        <style>
            body[data-startup] > :not(#bloom-module-loading):not(#bloom-error-popup):not(script) {
                visibility: hidden;
            }
            #bloom-module-loading {
                position: fixed;
                inset: 0;
                z-index: 1000;
                display: grid;
                place-items: center;
                overflow: auto;
                padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
                    max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
                background: #e3ead6;
                color: #33483b;
                font:
                    600 16px/1.5 system-ui,
                    sans-serif;
            }
            .startup-panel {
                box-sizing: border-box;
                width: min(100%, 420px);
                padding: 24px;
                border: 2px solid #d5dfd0;
                border-radius: 20px;
                background: #f8faef;
                text-align: center;
            }
            .startup-panel h1 {
                margin: 0 0 16px;
                font-size: 28px;
                letter-spacing: 0.1em;
            }
            .startup-panel p {
                margin: 8px 0;
            }
            #bloom-loading-detail {
                min-height: 1.5em;
                color: #566850;
                font-size: 14px;
                overflow-wrap: anywhere;
            }
            #bloom-loading-progress {
                display: block;
                width: 100%;
                height: 12px;
                margin: 20px 0;
                accent-color: #526e50;
            }
            #bloom-loading-retry {
                display: inline-grid;
                place-items: center;
                text-decoration: none;
                min-height: 48px;
                padding: 0 24px;
                border: 2px solid #526e50;
                border-radius: 14px;
                background: #526e50;
                color: #fffbee;
                font: inherit;
                touch-action: manipulation;
            }
        </style>
        <link rel="stylesheet" href="./src/styles/seedling-reveal.css" />
    </head>
    <body data-startup="loading" aria-busy="true">
        <section id="bloom-module-loading" aria-labelledby="bloom-loading-title">
            <div class="startup-panel">
                <h1 id="bloom-loading-title">BUDMORI</h1>
                <p id="bloom-loading-label" role="status" aria-live="polite" data-i18n="loadingLabel"></p>
                <progress id="bloom-loading-progress" data-i18n-aria-label="loadingProgress"></progress>
                <p id="bloom-loading-detail" data-i18n="loadingDetail"></p>
                <a id="bloom-loading-retry" href="" data-i18n="loadingRetry"></a>
                <noscript>게임을 시작하려면 JavaScript를 켜 주세요. · Turn on JavaScript to play.</noscript>
            </div>
        </section>
        <script type="module" src="./src/startup-loading.js"></script>
        <canvas id="world" data-i18n-aria-label="worldLabel"></canvas>
        <div class="tower-tint" id="towerTint" aria-hidden="true"></div>
        <aside id="seedlingReveal" class="seedling-reveal" role="status" aria-live="polite" hidden></aside>
        <div class="floor-banner" id="floorBanner" role="status" hidden>
            <b id="floorBannerNum"></b><small id="floorBannerKind"></small>
        </div>
        <header>
            <div class="hud__stats">
                <div class="chip">
                    <i class="dot"></i><span class="chip__label" data-i18n="troopsLabel"></span><b id="count">36</b
                    ><small>/ <span id="capacity">72</span></small>
                </div>
                <div class="chip chip--floor" id="floorChip" hidden><b id="floorNow"></b></div>
                <div class="chip chip--growth" id="overallGrowth">
                    <span id="overallLevel" data-i18n="overallLevel"></span><small id="overallXp"></small>
                </div>
                <small id="starter" class="hud__note"></small>
                <small id="productVersion" class="hud__version">0.10.2</small>
            </div>
        </header>
        <button
            id="gameMenu"
            class="corner-settings"
            data-i18n-aria-label="settingsOpen"
            aria-haspopup="dialog"
            aria-controls="gameMenuOverlay"
            aria-expanded="false"
            data-i18n-title="settingsTitle"
            data-icon="settings"
        ></button>

        <section class="bossbar" id="bossbar" hidden>
            <div class="bossbar__row bossbar__row--ally">
                <strong data-i18n="allies"></strong><small id="allyHealthText"></small>
            </div>
            <div class="track track--ally">
                <div
                    class="fill ally"
                    id="allyHealth"
                    role="progressbar"
                    data-i18n-aria-label="allyHealth"
                    aria-valuemin="0"
                ></div>
            </div>
            <div class="bossbar__row bossbar__row--boss">
                <strong id="bossName" data-i18n="bossName"></strong><small id="bossHealthText"></small>
            </div>
            <div class="track track--boss">
                <div
                    class="fill"
                    id="bossHealth"
                    role="progressbar"
                    data-i18n-aria-label="bossHealth"
                    aria-valuemin="0"
                ></div>
                <div class="stagger" id="bossStagger" aria-hidden="true"></div>
            </div>
            <div id="bossRelicHost"></div>
            <small id="bossHealthNote" data-i18n="bossHealthNote"></small>
            <button id="fightRetreat" class="btn btn--secondary" type="button" hidden data-i18n="fightRetreat"></button>
        </section>
        <dialog id="speciesInfoDialog" class="species-info" aria-labelledby="speciesInfoTitle">
            <header>
                <h2 id="speciesInfoTitle" data-i18n="speciesInfoTitle"></h2>
                <button
                    type="button"
                    class="dialog-close"
                    data-species-info-close
                    data-i18n-aria-label="speciesInfoClose"
                    autofocus
                    data-i18n="close"
                ></button>
            </header>
            <div id="speciesInfoBody"></div>
        </dialog>
        <section id="deckDialog" class="deck-dialog" role="dialog" aria-modal="true" aria-labelledby="deckTitle" hidden>
            <div class="deck-dialog__card">
                <header>
                    <h2 id="deckTitle" data-i18n="deckTitle"></h2>
                    <button
                        id="deckClose"
                        class="dialog-close"
                        type="button"
                        data-i18n-aria-label="deckClose"
                        data-icon="close"
                    ></button>
                </header>
                <p data-i18n="deckHint"></p>
                <div class="deck-cards" id="deckCards"></div>
                <button id="deckGo" class="btn btn--primary" type="button" data-i18n="climbTower"></button>
            </div>
        </section>
        <section
            id="codexDialog"
            class="deck-dialog codex-dialog"
            role="dialog"
            aria-modal="true"
            aria-labelledby="codexTitle"
            hidden
        >
            <div class="deck-dialog__card">
                <header>
                    <h2 id="codexTitle" data-i18n="codex"></h2>
                    <button
                        id="codexClose"
                        class="dialog-close"
                        type="button"
                        data-i18n-aria-label="codexClose"
                        data-icon="close"
                    ></button>
                </header>
                <div class="pill-tabs" role="tablist" id="codexTabs"></div>
                <div class="codex-body" id="codexBody"></div>
            </div>
        </section>
        <section
            id="towerSummit"
            class="tower-summit"
            role="dialog"
            aria-modal="true"
            aria-labelledby="summitTitle"
            hidden
        >
            <div class="tower-summit__title">
                <small data-i18n="summitEyebrow"></small>
                <h1 id="summitTitle" data-i18n="summitTitle"></h1>
                <p data-i18n="summitArrived"></p>
            </div>
            <div class="tower-summit__footer">
                <small data-i18n="summitKept"></small
                ><button id="summitSkip" class="btn btn--primary" type="button" data-i18n="summitSkip"></button>
            </div>
        </section>
        <p id="battleOutcome" role="status" hidden></p>
        <section
            id="bossRewardDialog"
            class="boss-reward-dialog"
            role="dialog"
            aria-modal="true"
            aria-labelledby="bossRewardTitle"
            hidden
        >
            <div class="boss-reward-dialog__card">
                <header>
                    <div>
                        <small id="bossRewardStage"></small>
                        <h2 id="bossRewardTitle" data-i18n="rewardChest"></h2>
                    </div>
                    <button
                        id="bossRewardClose"
                        class="dialog-close"
                        type="button"
                        data-i18n-aria-label="rewardChestClose"
                        data-icon="close"
                    ></button>
                </header>
                <p id="bossRewardSummary" role="status"></p>
                <div id="bossRewardChestScene" class="boss-reward-chest-scene">
                    <div class="boss-reward-ground"></div>
                    <div id="bossRewardGlow" class="boss-reward-glow"></div>
                    <div id="bossRewardMouth" class="boss-reward-mouth"></div>
                    <div id="bossRewardChestWrap" class="boss-reward-chest-wrap">
                        <svg
                            id="bossRewardChest"
                            class="boss-reward-chest"
                            viewBox="60 -14 380 288"
                            role="img"
                            data-i18n-aria-label="rewardChest"
                        >
                            <defs>
                                <clipPath id="bossRewardLidClip">
                                    <path d="M86 152q2-72 56-86h216q54 14 56 86z" />
                                </clipPath>
                            </defs>
                            <g class="boss-reward-chest__body">
                                <path class="cr-wood" d="M98 152h304v100a16 16 0 0 1-16 16H114a16 16 0 0 1-16-16z" />
                                <path class="cr-wood-dk" d="M98 216h304v36a16 16 0 0 1-16 16H114a16 16 0 0 1-16-16z" />
                                <path class="cr-seam" d="M200 164v92M300 164v92" />
                                <rect class="cr-metal cr-line" x="126" y="152" width="36" height="116" />
                                <rect class="cr-metal cr-line" x="338" y="152" width="36" height="116" />
                                <path class="cr-line" d="M98 152h304v100a16 16 0 0 1-16 16H114a16 16 0 0 1-16-16z" />
                            </g>
                            <g class="boss-reward-chest__lid-pivot">
                                <g class="boss-reward-chest__lid">
                                    <path class="cr-wood" d="M86 152q2-72 56-86h216q54 14 56 86z" />
                                    <g clip-path="url(#bossRewardLidClip)">
                                        <path class="cr-hi" d="M120 100q20-22 60-24h140q-60 6-200 24z" />
                                        <rect class="cr-metal" x="126" y="60" width="36" height="96" />
                                        <rect class="cr-metal" x="338" y="60" width="36" height="96" />
                                    </g>
                                    <path class="cr-line" d="M86 152q2-72 56-86h216q54 14 56 86z" />
                                    <rect class="cr-metal cr-line" x="80" y="134" width="340" height="22" rx="8" />
                                </g>
                            </g>
                            <g class="boss-reward-chest__lock">
                                <rect class="cr-lock cr-line" x="222" y="124" width="56" height="70" rx="16" />
                                <rect class="cr-hi" x="230" y="132" width="10" height="26" rx="5" />
                                <circle class="cr-key" cx="250" cy="156" r="8" />
                                <rect class="cr-key" x="246" y="158" width="8" height="20" rx="4" />
                            </g>
                        </svg>
                    </div>
                    <div id="bossRewardSprouts" class="boss-reward-sprouts" aria-hidden="true"></div>
                </div>
                <div id="bossRewardPrize" class="boss-reward-prize" role="status" aria-live="polite">
                    <span id="bossRewardBand" class="boss-reward-band" hidden></span>
                    <strong id="bossRewardPopAmount"></strong>
                </div>
                <p id="bossRewardTotals"></p>
                <footer>
                    <small id="bossRewardRevealCount"></small>
                    <button id="bossRewardOpenAll" type="button" data-i18n="rewardOpenAll"></button>
                </footer>
            </div>
        </section>
        <div id="gameplayDock">
            <div class="bottom">
                <button
                    id="bossRewardOpen"
                    class="boss-reward-open"
                    type="button"
                    hidden
                    data-i18n="rewardChestOpen"
                ></button>
                <section class="doors" id="towerDoors" hidden>
                    <h2 id="doorsTitle"></h2>
                    <small id="doorsNote"></small>
                    <div class="doors__boss" id="doorBoss" hidden>
                        <div class="doors__boss-body" id="doorBossBody">
                            <svg class="doors__boss-fx" id="doorBossFx" viewBox="0 0 200 200" aria-hidden="true"></svg>
                            <img id="doorBossImg" width="96" height="96" alt="" draggable="false" />
                            <span class="doors__boss-ring" id="doorBossRing"></span>
                        </div>
                        <div class="doors__boss-cards" id="doorBossCards" data-i18n-aria-label="bossCards"></div>
                    </div>
                    <div class="doors__cards" id="doorCards"></div>
                    <div class="doors__receipts" id="doorReceipts" hidden></div>
                    <span
                        id="doorAnnouncement"
                        class="sr-only"
                        role="status"
                        aria-live="polite"
                        aria-atomic="true"
                    ></span>
                    <button id="towerLeave" class="btn btn--secondary" type="button" data-i18n="towerLeave"></button>
                </section>
                <section class="battle-commands" id="battleCommands" data-i18n-aria-label="battleCommands" hidden>
                    <small id="frontlineStatus" class="battle-commands__status"></small>
                    <div class="battle-commands__choices" role="radiogroup" data-i18n-aria-label="battleCommandChoices">
                        <label
                            ><input type="radio" name="battleCommand" value="engage" checked /><span
                                data-i18n="commandEngage"
                            ></span
                        ></label>
                        <label
                            ><input type="radio" name="battleCommand" value="scatter" /><span
                                data-i18n="commandScatter"
                            ></span
                        ></label>
                        <label
                            ><input type="radio" name="battleCommand" value="retreat" /><span
                                data-i18n="commandRetreat"
                            ></span
                        ></label>
                    </div>
                    <small id="battleCommandNote" class="battle-commands__status" data-i18n="commandEngageNote"></small>
                </section>
                <div class="work-hud" id="workHud">
                    <div class="work-hud__row">
                        <b data-i18n="workHudTitle"></b
                        ><small id="workHudNote" role="status" data-i18n="workHudNote"></small>
                    </div>
                    <div class="work-hud__labels">
                        <span id="workHudBreed" data-i18n="workHudBreed"></span
                        ><span id="workHudFood" data-i18n="workHudFood"></span>
                    </div>
                    <input
                        id="workCutA"
                        class="flat-range work-hud__cut"
                        type="range"
                        min="0"
                        max="100"
                        step="5"
                        value="60"
                        data-i18n-aria-label="workCut"
                    />
                </div>
                <label class="start-floor" id="startFloorBox" hidden>
                    <span id="startFloorValue" data-i18n="startFloorValue"></span>
                    <input
                        id="startFloor"
                        class="flat-range"
                        type="range"
                        min="1"
                        max="1"
                        step="1"
                        value="1"
                        data-i18n-aria-label="startFloor"
                    />
                </label>
                <div class="controls" id="farmControls">
                    <button
                        id="merge"
                        class="btn btn--secondary"
                        type="button"
                        aria-describedby="mergeNotice"
                        data-i18n="merge"
                    ></button>
                    <button id="combine" class="btn btn--secondary" type="button" data-i18n="combine"></button>
                    <button
                        id="codexOpen"
                        class="btn btn--secondary"
                        type="button"
                        data-i18n-aria-label="codex"
                        data-i18n="codex"
                    ></button>
                    <button id="bossChallenge" class="btn btn--primary" type="button" data-i18n="climbTower"></button>
                </div>
                <small id="towerResult" class="tower-result" role="status" hidden></small>
                <small id="mergeNotice" role="status" aria-live="polite"></small>
                <small id="offlineNotice" class="offline-notice" role="status" aria-live="polite" hidden></small>
                <small id="farmNotice" class="offline-notice" role="status" aria-live="polite" hidden></small>
            </div>
            <div class="utility">
                <button
                    id="upgradeMenu"
                    data-i18n-aria-label="upgradesOpen"
                    data-i18n-title="upgrades"
                    aria-haspopup="dialog"
                    aria-controls="gameMenuOverlay"
                    aria-expanded="false"
                    data-icon="upgrade"
                ></button>
                <button
                    id="helpMenu"
                    data-i18n-aria-label="helpOpen"
                    data-i18n-title="help"
                    aria-haspopup="dialog"
                    aria-controls="gameMenuOverlay"
                    aria-expanded="false"
                    data-icon="help"
                ></button>
            </div>
        </div>
        <div class="game-menu-overlay" id="gameMenuOverlay" hidden>
            <section
                class="game-menu"
                id="gameMenuPanel"
                role="dialog"
                aria-modal="true"
                aria-labelledby="gameMenuTitle"
                tabindex="-1"
            >
                <header class="game-menu__header">
                    <h2 id="gameMenuTitle" data-i18n="gameMenuTitle"></h2>
                    <button
                        id="gameMenuClose"
                        class="dialog-close"
                        type="button"
                        data-i18n-aria-label="gameMenuClose"
                        data-icon="close"
                    ></button>
                </header>
                <div class="game-menu__content">
                    <section
                        class="game-menu__pane game-menu__play"
                        id="menuPlayPanel"
                        role="tabpanel"
                        aria-labelledby="gameMenuTitle"
                    >
                        <button id="returnHome" class="btn btn--secondary game-menu__return" type="button">
                            <span data-icon="home"></span><span data-i18n="returnHome"></span
                            ><span aria-hidden="true">→</span>
                        </button>
                        <p class="game-menu__return-note" data-i18n="returnHomeNote"></p>
                        <div class="game-menu__setting">
                            <span data-i18n="sound"></span
                            ><button id="sound" type="button" data-i18n-aria-label="soundOff" aria-pressed="true">
                                <span id="soundState" data-i18n="soundOn"></span>
                            </button>
                        </div>
                        <div class="game-menu__setting">
                            <span id="languageLabel" data-i18n="languageLabel"></span>
                            <div
                                class="game-menu__choices"
                                id="languageChoices"
                                role="group"
                                aria-labelledby="languageLabel"
                            ></div>
                        </div>
                        <p id="languageNotice" role="status"></p>
                        <div class="game-menu__setting">
                            <label for="diagnosticDetail" data-i18n="diagnosticDetail"></label
                            ><input id="diagnosticDetail" type="checkbox" />
                        </div>
                        <button
                            class="game-menu__home btn btn--secondary"
                            id="copyDiagnostics"
                            type="button"
                            data-i18n="copyDiagnostics"
                        ></button>
                        <details>
                            <summary data-i18n="diagnosticOptions"></summary>
                            <button
                                id="exportDiagnostics"
                                class="btn"
                                type="button"
                                data-i18n="exportDiagnostics"
                            ></button>
                            <p data-i18n="diagnosticHelp"></p>
                        </details>
                        <p id="diagnosticStatus" role="status"></p>
                        <textarea
                            id="settingsDiagnosticText"
                            data-i18n-aria-label="diagnosticResult"
                            readonly
                            hidden
                        ></textarea>
                        <div class="game-menu__setting game-menu__version">
                            <span data-i18n="version"></span><span id="settingsVersion"></span>
                        </div>
                        <button
                            id="settingsCheckUpdate"
                            class="btn btn--secondary"
                            type="button"
                            data-i18n="checkUpdate"
                        ></button>
                        <p id="settingsAppNotice" role="status"></p>
                    </section>
                    <section
                        id="farmPanel"
                        class="game-menu__pane farm-admin"
                        role="tabpanel"
                        aria-labelledby="gameMenuTitle"
                        hidden
                    >
                        <div class="farm-stats" aria-live="polite">
                            <div class="farm-stat">
                                <small data-i18n="farmPlaced"></small><b id="farmStatPlaced">0</b
                                ><span id="farmStatCapacity"></span>
                            </div>
                            <div class="farm-stat">
                                <small data-i18n="farmPending"></small><b id="farmStatPending">0</b>
                            </div>
                        </div>
                        <div id="farmQueue" class="farm-queue" hidden></div>
                        <p id="farmLockNote" class="farm-lock" role="status" hidden data-i18n="farmLocked"></p>
                        <div class="breed-heading">
                            <h3 data-i18n="breedShare"></h3>
                            <button
                                type="button"
                                id="speciesBreedEqual"
                                class="farm-sort"
                                data-i18n="breedEqual"
                            ></button>
                        </div>
                        <p id="speciesBreedHint" class="farm-hint" data-i18n="breedHint"></p>
                        <div
                            id="speciesRoles"
                            class="breed-chips"
                            role="group"
                            data-i18n-aria-label="breedSpecies"
                        ></div>
                        <div class="breed-editor">
                            <div class="breed-editor__label">
                                <label id="speciesBreedLabel" for="speciesBreedShare" data-i18n="breedShare"></label>
                                <output id="speciesBreedValue" for="speciesBreedShare">0%</output>
                            </div>
                            <div class="breed-editor__controls">
                                <button
                                    type="button"
                                    id="speciesBreedLess"
                                    data-i18n-aria-label="breedLess"
                                    data-icon="minus"
                                ></button>
                                <input
                                    id="speciesBreedShare"
                                    class="flat-range"
                                    type="range"
                                    min="0"
                                    max="100"
                                    step="1"
                                    value="0"
                                    aria-describedby="speciesBreedHint speciesBreedPlan"
                                />
                                <button
                                    type="button"
                                    id="speciesBreedMore"
                                    data-i18n-aria-label="breedMore"
                                    data-icon="plus"
                                ></button>
                            </div>
                            <p id="speciesBreedPlan" class="farm-hint"></p>
