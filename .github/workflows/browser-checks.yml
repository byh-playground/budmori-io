name: Browser checks
on:
    pull_request:
    push:
        branches: [main]
    workflow_dispatch:
permissions:
    contents: read
jobs:
    core:
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - uses: actions/cache@v4
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-ubuntu-24.04-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
            - name: Install Chromium
              run: |
                  ./node_modules/.bin/playwright install-deps chromium
                  ./node_modules/.bin/playwright install chromium
            - id: check
              run: npm run check
            - if: ${{ !cancelled() && steps.check.outcome == 'success' }}
              run: timeout 180s npm run test:home
            - if: ${{ !cancelled() && steps.check.outcome == 'success' }}
              run: timeout 180s npm run test:locale
            - if: ${{ !cancelled() && steps.check.outcome == 'success' }}
              run: timeout 180s npm run test:source-smoke
            - if: ${{ !cancelled() && steps.check.outcome == 'success' }}
              run: timeout 180s npm run test:stat-cards
            - if: ${{ !cancelled() && steps.check.outcome == 'success' }}
              run: timeout 180s npm run test:pwa-update
            - if: ${{ !cancelled() && steps.check.outcome == 'success' }}
              run: timeout 300s npm run test:startup-loading
            - if: ${{ !cancelled() && steps.check.outcome == 'success' }}
              run: timeout 180s npm run test:seedling-motion
            - if: ${{ !cancelled() && steps.check.outcome == 'success' }}
              run: timeout 180s npm run test:graphics-recovery
            - if: ${{ !cancelled() && steps.check.outcome == 'success' }}
              run: timeout 180s npm run test:unit-sprites
            - if: ${{ !cancelled() && steps.check.outcome == 'success' }}
              run: timeout 300s npm test
            - if: ${{ !cancelled() && steps.check.outcome == 'success' }}
              run: timeout 180s npm run test:breed-allocation
            - if: ${{ !cancelled() && steps.check.outcome == 'success' }}
              run: timeout 180s npm run test:food-reservations
            - if: ${{ !cancelled() && steps.check.outcome == 'success' }}
              run: timeout 180s npm run test:hud-sampling
            - if: ${{ !cancelled() && steps.check.outcome == 'success' }}
              run: timeout 180s npm run test:codex
            - if: ${{ !cancelled() && steps.check.outcome == 'success' }}
              run: timeout 180s npm run test:seedling-growth
            - if: ${{ !cancelled() && steps.check.outcome == 'success' }}
              run: timeout 180s npm run test:combine-air
            - if: ${{ !cancelled() && steps.check.outcome == 'success' }}
              run: timeout 180s npm run test:tower-army
            - if: ${{ !cancelled() && steps.check.outcome == 'success' }}
              run: timeout 180s npm run test:camera -- desktop
            - if: ${{ !cancelled() && steps.check.outcome == 'success' }}
              run: timeout 180s npm run test:camera -- portrait
            - if: ${{ !cancelled() && steps.check.outcome == 'success' }}
              run: timeout 180s npm run test:camera -- landscape
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: browser-checks-core
                  path: tests/output/
                  if-no-files-found: ignore
