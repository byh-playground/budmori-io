name: Budmori gamekit verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: budmori-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  required-smoke:
    name: Required build smoke
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check verifier syntax
        run: node --check scripts/gamekit-provenance.cjs
      - name: Verify pinned offline gamekit and inline bundles
        run: node tests/provenance.cjs
