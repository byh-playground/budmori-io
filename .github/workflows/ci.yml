name: Budmori gamekit verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  actual-game:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run verify:upstream
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Compare rollback and lockstep with identical inputs
        run: npm run test:benchmark:modes
      - name: Verify exact Pages bytes after main deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/verify-pages.mjs
