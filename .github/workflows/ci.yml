name: Budmori gamekit verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  actual-game:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
