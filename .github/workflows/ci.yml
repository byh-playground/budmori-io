name: Budmori gamekit verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: budmori-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  required-smoke:
    name: Required build smoke
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check verifier syntax
        run: node --check scripts/gamekit-provenance.cjs
      - name: Verify pinned offline gamekit and inline bundles
        run: node tests/provenance.cjs

  full-verification:
    name: Full game verification (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run verify:upstream
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Verify unsupported-save protection and explicit new-game UI
        run: npm run test:browser:save
      - name: Verify five-player public world in real browsers
        run: xvfb-run -a npm run test:browser:multiplayer
        env:
          BUDMORI_HEADED: "1"
      - name: Measure cooperative snapshot jobs in Chromium
        run: npm run test:browser:snapshots
      - name: Compare rollback and lockstep with identical inputs
        run: npm run test:benchmark:modes
      - name: Verify exact Pages bytes after main deployment
        if: github.ref == 'refs/heads/main'
        run: node scripts/verify-pages.mjs
      - name: Upload browser reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: budmori-browser-verification
          path: |
            tests/*report.json
            tests/*.png
          if-no-files-found: ignore
          retention-days: 14
