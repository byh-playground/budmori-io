name: Budmori gamekit verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  actual-game:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify:upstream
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Compare exact v65 Worker baseline against this main-thread build
        run: |
          git show b545953af9c76facf6896726740ec8fa8253a6ca:index.html > tests/fixtures/v65-worker.html
          xvfb-run -a npm run test:benchmark
      - name: Verify exact Pages bytes after main deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/verify-pages.mjs
