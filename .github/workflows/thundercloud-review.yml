name: Temporary thundercloud visual review
on:
    pull_request:
permissions:
    contents: read
jobs:
    browser:
        runs-on: ubuntu-latest
        timeout-minutes: 8
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npx playwright install --with-deps chromium
            - run: npm run build
            - run: timeout 180s node tests/thundercloud-review.mjs
            - run: timeout 180s npm test
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: thundercloud-visual-review
                  path: tests/output/thundercloud/
                  if-no-files-found: ignore
