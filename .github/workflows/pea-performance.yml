name: Pea version performance
on:
    pull_request:
        paths:
            - 'index.html'
            - 'src/**'
            - 'assets/**'
            - 'vendor/**'
            - 'gamekit-lock.json'
            - 'package*.json'
            - 'scripts/build.cjs'
            - 'tests/pea-performance.e2e.mjs'
            - '.github/workflows/pea-performance.yml'
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: pea-performance-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true
jobs:
    paired-browser:
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npx playwright install --with-deps chromium
            - run: npm run build
            - name: Archive the exact legacy baseline without changing the candidate
              env:
                  BASE_COMMIT: b60cf67f8dbfcfaa0ec3c59b721f6fd1b3a016f6
              run: |
                  git fetch --no-tags --depth=1 origin "$BASE_COMMIT"
                  test "$(git rev-parse FETCH_HEAD)" = "$BASE_COMMIT"
                  BASE_ROOT="$(mktemp -d /tmp/budmori-pea-base.XXXXXX)"
                  git archive "$BASE_COMMIT" | tar -x -C "$BASE_ROOT"
                  echo "PEA_PERFORMANCE_BASE_ROOT=$BASE_ROOT" >> "$GITHUB_ENV"
            - name: Compare three alternating pairs in one Chromium SwiftShader process
              run: timeout 720s node tests/pea-performance.e2e.mjs
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: pea-version-performance
                  path: tests/output/pea-performance/
                  if-no-files-found: error
            - name: Remove the temporary legacy archive
              if: always()
              run: |
                  if [ -n "$PEA_PERFORMANCE_BASE_ROOT" ]; then
                    rm -rf -- "$PEA_PERFORMANCE_BASE_ROOT"
                  fi
