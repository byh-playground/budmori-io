name: Farm browser checks
on:
    pull_request:
        paths:
            - 'index.html'
            - 'src/breed-allocation.js'
            - 'src/features/species-growth/**'
            - 'src/features/projectiles/**'
            - 'src/features/unit-attacks/lob/**'
            - 'src/features/abilities/corn-attachment/**'
            - 'src/ability-*.js'
            - 'src/ability-tree.css'
            - 'src/species-growth-presentation.js'
            - 'src/help-scenes.js'
            - 'src/farm-model.js'
            - 'src/farm-session.js'
            - 'src/farm-render-items.js'
            - 'src/farm-app.js'
            - 'src/styles/game-menu.css'
            - 'tests/breed-allocation.e2e.mjs'
            - 'tests/corn-growth.e2e.mjs'
            - '.github/workflows/breed-allocation-ui-checks.yml'
permissions:
    contents: read
jobs:
    browser:
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npx playwright install --with-deps chromium
            - id: build
              run: npm run build
            - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
              run: timeout 180s npm run test:breed-allocation
            - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
              run: timeout 180s npm run test:corn-growth:case -- ui desktop
            - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
              run: timeout 180s npm run test:corn-growth:case -- ui mobile
            - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
              run: timeout 180s npm run test:corn-growth:case -- previews desktop
            - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
              run: timeout 180s npm run test:corn-growth:case -- previews mobile
            - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
              run: timeout 180s npm run test:corn-growth:case -- battle desktop
            - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
              run: timeout 180s npm run test:corn-growth:case -- battle mobile
            - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
              run: timeout 180s npm run test:corn-growth:case -- battle landscape
            - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
              run: timeout 180s npm test
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: farm-browser-evidence
                  path: |
                      tests/output/breed-allocation/
                      tests/output/corn-growth/
                  if-no-files-found: ignore
