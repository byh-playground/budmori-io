name: Farm browser checks
on:
    pull_request:
        types: [labeled, synchronize]
    workflow_dispatch:
        inputs:
            species:
                description: Species to check (all keeps the complete existing suite)
                type: choice
                default: peanut
                options: [peanut, chestnut, redbean, pea, corn, all]
            regression:
                description: Also run the complete common browser regressions
                type: boolean
                default: true
permissions:
    contents: read
jobs:
    browser:
        if: ${{ github.event_name == 'workflow_dispatch' || ((contains(github.event.pull_request.labels.*.name, 'verify-gameplay') || contains(github.event.pull_request.labels.*.name, 'verify-peanut-desktop')) && (github.event.action != 'labeled' || github.event.label.name == 'verify-gameplay' || github.event.label.name == 'verify-peanut-desktop')) }}
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        env:
            FOCUSED_PEANUT_DESKTOP: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'verify-peanut-desktop') && !contains(github.event.pull_request.labels.*.name, 'verify-gameplay') }}
        strategy:
            fail-fast: false
            matrix:
                species: ${{ fromJSON((github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'verify-peanut-desktop') && !contains(github.event.pull_request.labels.*.name, 'verify-gameplay')) && '["peanut"]' || (github.event_name == 'workflow_dispatch' && inputs.species != 'all' && format('["{0}"]', inputs.species) || '["corn","pea","redbean","chestnut","peanut"]')) }}
                viewport: ${{ fromJSON((github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'verify-peanut-desktop') && !contains(github.event.pull_request.labels.*.name, 'verify-gameplay')) && '["desktop"]' || '["desktop","mobile","landscape"]') }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - uses: actions/cache@v4
              id: playwright-cache
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-ubuntu-24.04-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
            - name: Install official Chromium OS dependencies (timed)
              run: |
                  mkdir -p tests/output/browser-setup
                  echo "runner=${ImageOS} image=${ImageVersion} arch=$(uname -m) cache=${{ steps.playwright-cache.outputs.cache-hit }}" > tests/output/browser-setup/setup.txt
                  echo "dependencies_start=$(date -u +%FT%TZ)" >> tests/output/browser-setup/setup.txt
                  ./node_modules/.bin/playwright install-deps chromium
                  echo "dependencies_end=$(date -u +%FT%TZ)" >> tests/output/browser-setup/setup.txt
                  dpkg-query -W fonts-freefont-ttf fonts-ipafont-gothic fonts-wqy-zenhei libnss3 xvfb >> tests/output/browser-setup/setup.txt
            - name: Install exact pinned Chromium (timed, including partial cache)
              run: |
                  echo "browser_start=$(date -u +%FT%TZ)" >> tests/output/browser-setup/setup.txt
                  ./node_modules/.bin/playwright install chromium
                  echo "browser_end=$(date -u +%FT%TZ)" >> tests/output/browser-setup/setup.txt
                  node --input-type=module -e "import {chromium} from 'playwright'; import {execFileSync} from 'node:child_process'; console.log(execFileSync(chromium.executablePath(), ['--version'], {encoding:'utf8'}));" >> tests/output/browser-setup/setup.txt
                  ./node_modules/.bin/playwright --version >> tests/output/browser-setup/setup.txt
            - id: check
              run: npm run check
            - name: Record focused validation scope
              if: ${{ env.FOCUSED_PEANUT_DESKTOP == 'true' }}
              run: |
                  echo 'Focused check: peanut desktop previews-low, previews-high and continuity only.' >> "$GITHUB_STEP_SUMMARY"
                  echo 'UI, battle, battle-extra, migration and common regressions are skipped, not passed by this run.' >> "$GITHUB_STEP_SUMMARY"
            # Corn's existing landscape scenario is combat-only; its seven established cases remain.
            - if: ${{ !cancelled() && steps.check.outcome == 'success' && env.FOCUSED_PEANUT_DESKTOP != 'true' && (matrix.species != 'corn' || matrix.viewport != 'landscape') }}
              run: timeout 180s npm run test:${{ matrix.species }}-growth:case -- ui ${{ matrix.viewport }}
            - if: ${{ !cancelled() && steps.check.outcome == 'success' && env.FOCUSED_PEANUT_DESKTOP != 'true' && (matrix.species != 'corn' || matrix.viewport != 'landscape') && matrix.species != 'redbean' && matrix.species != 'chestnut' && matrix.species != 'peanut' }}
              run: timeout 300s npm run test:${{ matrix.species }}-growth:case -- previews ${{ matrix.viewport }}
            - if: ${{ !cancelled() && steps.check.outcome == 'success' && env.FOCUSED_PEANUT_DESKTOP != 'true' }}
              run: timeout 180s npm run test:${{ matrix.species }}-growth:case -- battle ${{ matrix.viewport }}
            - if: ${{ !cancelled() && steps.check.outcome == 'success' && env.FOCUSED_PEANUT_DESKTOP != 'true' && matrix.species == 'pea' }}
              run: timeout 180s npm run test:pea-growth:case -- migration ${{ matrix.viewport }}
            - if: ${{ !cancelled() && steps.check.outcome == 'success' && (matrix.species == 'redbean' || matrix.species == 'chestnut' || matrix.species == 'peanut') }}
              run: timeout ${{ matrix.species == 'peanut' && '300s' || '180s' }} npm run test:${{ matrix.species }}-growth:case -- previews-low ${{ matrix.viewport }}
            - if: ${{ !cancelled() && steps.check.outcome == 'success' && (matrix.species == 'redbean' || matrix.species == 'chestnut' || matrix.species == 'peanut') }}
              run: timeout ${{ matrix.species == 'peanut' && '300s' || '180s' }} npm run test:${{ matrix.species }}-growth:case -- previews-high ${{ matrix.viewport }}
            - if: ${{ !cancelled() && steps.check.outcome == 'success' && env.FOCUSED_PEANUT_DESKTOP != 'true' && (matrix.species == 'redbean' || matrix.species == 'chestnut' || matrix.species == 'peanut') }}
              run: timeout 180s npm run test:${{ matrix.species }}-growth:case -- battle-extra ${{ matrix.viewport }}
            - if: ${{ !cancelled() && steps.check.outcome == 'success' && (matrix.species == 'redbean' || matrix.species == 'chestnut' || matrix.species == 'peanut') }}
              run: timeout 180s npm run test:${{ matrix.species }}-growth:case -- continuity ${{ matrix.viewport }}
            - if: ${{ !cancelled() && steps.check.outcome == 'success' && env.FOCUSED_PEANUT_DESKTOP != 'true' && (matrix.species == 'redbean' || matrix.species == 'chestnut' || matrix.species == 'peanut') }}
              run: timeout 180s npm run test:${{ matrix.species }}-growth:case -- migration ${{ matrix.viewport }}
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: farm-browser-${{ matrix.species }}-${{ matrix.viewport }}
                  path: |
                      tests/output/${{ matrix.species }}-growth/
                      tests/output/browser-setup/
                  if-no-files-found: error
    # The focus label alone does not opt into common regressions; verify-gameplay keeps full coverage.
    regression:
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.regression) || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'verify-gameplay') && (github.event.action != 'labeled' || github.event.label.name == 'verify-gameplay' || github.event.label.name == 'verify-peanut-desktop')) }}
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - uses: actions/cache@v4
              id: playwright-cache
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-ubuntu-24.04-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
            - name: Install official Chromium OS dependencies (timed)
              run: |
                  mkdir -p tests/output/browser-setup
                  echo "runner=${ImageOS} image=${ImageVersion} arch=$(uname -m) cache=${{ steps.playwright-cache.outputs.cache-hit }}" > tests/output/browser-setup/setup.txt
                  echo "dependencies_start=$(date -u +%FT%TZ)" >> tests/output/browser-setup/setup.txt
                  ./node_modules/.bin/playwright install-deps chromium
                  echo "dependencies_end=$(date -u +%FT%TZ)" >> tests/output/browser-setup/setup.txt
                  dpkg-query -W fonts-freefont-ttf fonts-ipafont-gothic fonts-wqy-zenhei libnss3 xvfb >> tests/output/browser-setup/setup.txt
            - name: Install exact pinned Chromium (timed, including partial cache)
              run: |
                  echo "browser_start=$(date -u +%FT%TZ)" >> tests/output/browser-setup/setup.txt
                  ./node_modules/.bin/playwright install chromium
                  echo "browser_end=$(date -u +%FT%TZ)" >> tests/output/browser-setup/setup.txt
                  node --input-type=module -e "import {chromium} from 'playwright'; import {execFileSync} from 'node:child_process'; console.log(execFileSync(chromium.executablePath(), ['--version'], {encoding:'utf8'}));" >> tests/output/browser-setup/setup.txt
                  ./node_modules/.bin/playwright --version >> tests/output/browser-setup/setup.txt
            - id: check
              run: npm run check
            - if: ${{ !cancelled() && steps.check.outcome == 'success' }}
              run: timeout 180s npm run test:breed-allocation
            - if: ${{ !cancelled() && steps.check.outcome == 'success' }}
              run: timeout 180s npm test
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: farm-browser-regression
                  path: |
                      tests/output/breed-allocation/
                      tests/output/browser-setup/
                  if-no-files-found: error
