name: Farm browser checks
on:
    pull_request:
        paths:
            - 'index.html'
            - 'src/breed-allocation.js'
            - 'src/features/species-growth/**'
            - 'src/features/projectiles/**'
            - 'src/features/unit-attacks/**'
            - 'src/features/abilities/corn-attachment/**'
            - 'src/ability-*.js'
            - 'src/ability-tree.css'
            - 'src/species-growth-presentation.js'
            - 'src/help-scenes.js'
            - 'src/farm-model.js'
            - 'src/farm-session.js'
            - 'src/farm-render-items.js'
            - 'src/farm-app.js'
            - 'src/styles/game-menu.css'
            - 'tests/breed-allocation.e2e.mjs'
            - 'tests/corn-growth.e2e.mjs'
            - 'tests/pea-*.mjs'
            - 'tests/fixtures/pea-*.json'
            - 'src/farm-render-units.js'
            - 'src/unit-attack-capabilities.js'
            - 'src/unit-abilities.js'
            - '.github/workflows/breed-allocation-ui-checks.yml'
permissions:
    contents: read
jobs:
    browser:
        runs-on: ubuntu-latest
        timeout-minutes: 25
        strategy:
            fail-fast: false
            matrix:
                species: [corn, pea]
                viewport: [desktop, mobile, landscape]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npx playwright install --with-deps chromium
            - id: build
              run: npm run build
            - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
              run: timeout 180s npm run test:${{ matrix.species }}-growth:case -- ui ${{ matrix.viewport }}
            - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
              run: timeout 180s npm run test:${{ matrix.species }}-growth:case -- previews ${{ matrix.viewport }}
            - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
              run: timeout 180s npm run test:${{ matrix.species }}-growth:case -- battle ${{ matrix.viewport }}
            - if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.species == 'pea' }}
              run: timeout 180s npm run test:pea-growth:case -- migration ${{ matrix.viewport }}
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: farm-browser-${{ matrix.species }}-${{ matrix.viewport }}
                  path: tests/output/${{ matrix.species }}-growth/
                  if-no-files-found: error
    regression:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npx playwright install --with-deps chromium
            - id: build
              run: npm run build
            - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
              run: timeout 180s npm run test:breed-allocation
            - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
              run: timeout 180s npm test
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: farm-browser-regression
                  path: tests/output/breed-allocation/
                  if-no-files-found: error
