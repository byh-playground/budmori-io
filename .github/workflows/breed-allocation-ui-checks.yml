name: Farm browser checks
on:
    pull_request:
        paths:
            - 'index.html'
            - 'src/breed-allocation.js'
            - 'src/features/species-growth/**'
            - 'src/features/projectiles/**'
            - 'src/features/unit-attacks/**'
            - 'src/features/abilities/corn-attachment/**'
            - 'src/ability-*.js'
            - 'src/ability-tree.css'
            - 'src/species-growth-presentation.js'
            - 'src/help-scenes.js'
            - 'src/farm-model.js'
            - 'src/farm-session.js'
            - 'src/farm-render-items.js'
            - 'src/farm-renderer.js'
            - 'src/damage-numbers.js'
            - 'src/farm-app.js'
            - 'src/styles/game-menu.css'
            - 'tests/breed-allocation.e2e.mjs'
            - 'tests/corn-growth.e2e.mjs'
            - 'tests/pea-*.mjs'
            - 'tests/redbean-*.mjs'
            - 'tests/chestnut-*.mjs'
            - 'tests/peanut-*.mjs'
            - 'tests/fixtures/chestnut-0.34.0-peanut-legacy.json'
            - 'assets/troops/peanut.svg'
            - 'tests/fixtures/redbean-0.33.0-chestnut-legacy.json'
            - 'tests/fixtures/pea-0.32.0-redbean-legacy.json'
            - 'tests/fixtures/pea-*.json'
            - 'tests/fixtures/corn-0.31.0-pea-legacy.json'
            - 'tests/smoke.e2e.mjs'
            - 'src/farm-render-units.js'
            - 'src/unit-attack-capabilities.js'
            - 'src/unit-abilities.js'
            - '.github/workflows/breed-allocation-ui-checks.yml'
permissions:
    contents: read
jobs:
    browser:
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                species: [corn, pea, redbean, chestnut, peanut]
                viewport: [desktop, mobile, landscape]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - uses: actions/cache@v4
              id: playwright-cache
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-ubuntu-24.04-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
            - name: Install official Chromium OS dependencies (timed)
              run: |
                  mkdir -p tests/output/browser-setup
                  echo "runner=${ImageOS} image=${ImageVersion} arch=$(uname -m) cache=${{ steps.playwright-cache.outputs.cache-hit }}" > tests/output/browser-setup/setup.txt
                  echo "dependencies_start=$(date -u +%FT%TZ)" >> tests/output/browser-setup/setup.txt
                  ./node_modules/.bin/playwright install-deps chromium
                  echo "dependencies_end=$(date -u +%FT%TZ)" >> tests/output/browser-setup/setup.txt
                  dpkg-query -W fonts-freefont-ttf fonts-ipafont-gothic fonts-wqy-zenhei libnss3 xvfb >> tests/output/browser-setup/setup.txt
            - name: Install exact pinned Chromium (timed, including partial cache)
              run: |
                  echo "browser_start=$(date -u +%FT%TZ)" >> tests/output/browser-setup/setup.txt
                  ./node_modules/.bin/playwright install chromium
                  echo "browser_end=$(date -u +%FT%TZ)" >> tests/output/browser-setup/setup.txt
                  node --input-type=module -e "import {chromium} from 'playwright'; import {execFileSync} from 'node:child_process'; console.log(execFileSync(chromium.executablePath(), ['--version'], {encoding:'utf8'}));" >> tests/output/browser-setup/setup.txt
                  ./node_modules/.bin/playwright --version >> tests/output/browser-setup/setup.txt
            - id: build
              run: npm run build
            # Corn's existing landscape scenario is combat-only; its seven established cases remain.
            - if: ${{ !cancelled() && steps.build.outcome == 'success' && (matrix.species != 'corn' || matrix.viewport != 'landscape') }}
              run: timeout 180s npm run test:${{ matrix.species }}-growth:case -- ui ${{ matrix.viewport }}
            - if: ${{ !cancelled() && steps.build.outcome == 'success' && (matrix.species != 'corn' || matrix.viewport != 'landscape') && matrix.species != 'redbean' && matrix.species != 'chestnut' && matrix.species != 'peanut' }}
              run: timeout 300s npm run test:${{ matrix.species }}-growth:case -- previews ${{ matrix.viewport }}
            - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
              run: timeout 180s npm run test:${{ matrix.species }}-growth:case -- battle ${{ matrix.viewport }}
            - if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.species == 'pea' }}
              run: timeout 180s npm run test:pea-growth:case -- migration ${{ matrix.viewport }}
            - if: ${{ !cancelled() && steps.build.outcome == 'success' && (matrix.species == 'redbean' || matrix.species == 'chestnut' || matrix.species == 'peanut') }}
              run: timeout 180s npm run test:${{ matrix.species }}-growth:case -- previews-low ${{ matrix.viewport }}
            - if: ${{ !cancelled() && steps.build.outcome == 'success' && (matrix.species == 'redbean' || matrix.species == 'chestnut' || matrix.species == 'peanut') }}
              run: timeout 180s npm run test:${{ matrix.species }}-growth:case -- previews-high ${{ matrix.viewport }}
            - if: ${{ !cancelled() && steps.build.outcome == 'success' && (matrix.species == 'redbean' || matrix.species == 'chestnut' || matrix.species == 'peanut') }}
              run: timeout 180s npm run test:${{ matrix.species }}-growth:case -- battle-extra ${{ matrix.viewport }}
            - if: ${{ !cancelled() && steps.build.outcome == 'success' && (matrix.species == 'redbean' || matrix.species == 'chestnut' || matrix.species == 'peanut') }}
              run: timeout 180s npm run test:${{ matrix.species }}-growth:case -- continuity ${{ matrix.viewport }}
            - if: ${{ !cancelled() && steps.build.outcome == 'success' && (matrix.species == 'redbean' || matrix.species == 'chestnut' || matrix.species == 'peanut') }}
              run: timeout 180s npm run test:${{ matrix.species }}-growth:case -- migration ${{ matrix.viewport }}
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: farm-browser-${{ matrix.species }}-${{ matrix.viewport }}
                  path: |
                      tests/output/${{ matrix.species }}-growth/
                      tests/output/browser-setup/
                  if-no-files-found: error
    regression:
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - uses: actions/cache@v4
              id: playwright-cache
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-ubuntu-24.04-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
            - name: Install official Chromium OS dependencies (timed)
              run: |
                  mkdir -p tests/output/browser-setup
                  echo "runner=${ImageOS} image=${ImageVersion} arch=$(uname -m) cache=${{ steps.playwright-cache.outputs.cache-hit }}" > tests/output/browser-setup/setup.txt
                  echo "dependencies_start=$(date -u +%FT%TZ)" >> tests/output/browser-setup/setup.txt
                  ./node_modules/.bin/playwright install-deps chromium
                  echo "dependencies_end=$(date -u +%FT%TZ)" >> tests/output/browser-setup/setup.txt
                  dpkg-query -W fonts-freefont-ttf fonts-ipafont-gothic fonts-wqy-zenhei libnss3 xvfb >> tests/output/browser-setup/setup.txt
            - name: Install exact pinned Chromium (timed, including partial cache)
              run: |
                  echo "browser_start=$(date -u +%FT%TZ)" >> tests/output/browser-setup/setup.txt
                  ./node_modules/.bin/playwright install chromium
                  echo "browser_end=$(date -u +%FT%TZ)" >> tests/output/browser-setup/setup.txt
                  node --input-type=module -e "import {chromium} from 'playwright'; import {execFileSync} from 'node:child_process'; console.log(execFileSync(chromium.executablePath(), ['--version'], {encoding:'utf8'}));" >> tests/output/browser-setup/setup.txt
                  ./node_modules/.bin/playwright --version >> tests/output/browser-setup/setup.txt
            - id: build
              run: npm run build
            - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
              run: timeout 180s npm run test:breed-allocation
            - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
              run: timeout 180s npm test
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: farm-browser-regression
                  path: |
                      tests/output/breed-allocation/
                      tests/output/browser-setup/
                  if-no-files-found: error
