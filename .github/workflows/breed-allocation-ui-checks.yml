name: Farm browser checks
on:
    pull_request:
        types: [labeled, synchronize]
    workflow_dispatch:
        inputs:
            species:
                description: Species to check (all keeps the complete existing suite)
                type: choice
                default: peanut
                options: [wheat, rice, walnut, peanut, chestnut, redbean, pea, corn, all]
            regression:
                description: Also run the complete common browser regressions
                type: boolean
                default: true
permissions:
    contents: read
jobs:
    browser:
        if: ${{ github.event_name == 'workflow_dispatch' || ((contains(github.event.pull_request.labels.*.name, 'verify-functional-growth') || contains(github.event.pull_request.labels.*.name, 'verify-gameplay') || contains(github.event.pull_request.labels.*.name, 'verify-peanut-desktop') || (contains(github.event.pull_request.labels.*.name, 'verify-walnut') || (contains(github.event.pull_request.labels.*.name, 'verify-rice') || (contains(github.event.pull_request.labels.*.name, 'verify-wheat') || contains(github.event.pull_request.labels.*.name, 'verify-chestnut'))))) && (github.event.action != 'labeled' || github.event.label.name == 'verify-functional-growth' || github.event.label.name == 'verify-gameplay' || github.event.label.name == 'verify-peanut-desktop' || github.event.label.name == 'verify-walnut' || github.event.label.name == 'verify-rice' || github.event.label.name == 'verify-wheat' || github.event.label.name == 'verify-chestnut')) }}
        runs-on: ubuntu-24.04
        timeout-minutes: ${{ contains(github.event.pull_request.labels.*.name, 'verify-functional-growth') && 150 || 30 }}
        env:
            FOCUSED_PEANUT_DESKTOP: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'verify-peanut-desktop') && !contains(github.event.pull_request.labels.*.name, 'verify-gameplay') }}
        strategy:
            fail-fast: false
            matrix:
                species: ${{ fromJSON((github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'verify-functional-growth') && !contains(github.event.pull_request.labels.*.name, 'verify-gameplay')) && '["functional"]' || (github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'verify-walnut') || (contains(github.event.pull_request.labels.*.name, 'verify-rice') || (contains(github.event.pull_request.labels.*.name, 'verify-wheat') || contains(github.event.pull_request.labels.*.name, 'verify-chestnut')))) && !contains(github.event.pull_request.labels.*.name, 'verify-gameplay')) && (contains(github.event.pull_request.labels.*.name, 'verify-chestnut') && '["chestnut"]' || contains(github.event.pull_request.labels.*.name, 'verify-wheat') && '["wheat"]' || contains(github.event.pull_request.labels.*.name, 'verify-rice') && '["rice"]' || '["walnut"]') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'verify-peanut-desktop') && !contains(github.event.pull_request.labels.*.name, 'verify-gameplay')) && '["peanut"]' || (github.event_name == 'workflow_dispatch' && inputs.species != 'all' && format('["{0}"]', inputs.species) || '["corn","pea","redbean","chestnut","peanut"]')) }}
                viewport: ${{ fromJSON((github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'verify-functional-growth') && !contains(github.event.pull_request.labels.*.name, 'verify-gameplay')) && '["desktop","landscape"]' || ((github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'verify-walnut') || (contains(github.event.pull_request.labels.*.name, 'verify-rice') || (contains(github.event.pull_request.labels.*.name, 'verify-wheat') || contains(github.event.pull_request.labels.*.name, 'verify-chestnut')))) && !contains(github.event.pull_request.labels.*.name, 'verify-gameplay')) || (github.event_name == 'workflow_dispatch' && (inputs.species == 'walnut' || inputs.species == 'rice' || inputs.species == 'wheat' || inputs.species == 'chestnut'))) && '["desktop","landscape"]' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'verify-peanut-desktop') && !contains(github.event.pull_request.labels.*.name, 'verify-gameplay')) && '["desktop"]' || '["desktop","mobile","landscape"]') }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - uses: actions/cache@v4
              id: playwright-cache
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-ubuntu-24.04-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
            - name: Install official Chromium OS dependencies (timed)
              run: |
                  mkdir -p tests/output/browser-setup
                  echo "runner=${ImageOS} image=${ImageVersion} arch=$(uname -m) cache=${{ steps.playwright-cache.outputs.cache-hit }}" > tests/output/browser-setup/setup.txt
                  echo "dependencies_start=$(date -u +%FT%TZ)" >> tests/output/browser-setup/setup.txt
                  ./node_modules/.bin/playwright install-deps chromium
                  echo "dependencies_end=$(date -u +%FT%TZ)" >> tests/output/browser-setup/setup.txt
                  dpkg-query -W fonts-freefont-ttf fonts-ipafont-gothic fonts-wqy-zenhei libnss3 xvfb >> tests/output/browser-setup/setup.txt
            - name: Install exact pinned Chromium (timed, including partial cache)
              run: |
                  echo "browser_start=$(date -u +%FT%TZ)" >> tests/output/browser-setup/setup.txt
                  ./node_modules/.bin/playwright install chromium
                  echo "browser_end=$(date -u +%FT%TZ)" >> tests/output/browser-setup/setup.txt
                  node --input-type=module -e "import {chromium} from 'playwright'; import {execFileSync} from 'node:child_process'; console.log(execFileSync(chromium.executablePath(), ['--version'], {encoding:'utf8'}));" >> tests/output/browser-setup/setup.txt
                  ./node_modules/.bin/playwright --version >> tests/output/browser-setup/setup.txt
            - id: check
              run: npm run check
            - name: Record focused validation scope
              if: ${{ env.FOCUSED_PEANUT_DESKTOP == 'true' }}
              run: |
                  echo 'Focused check: peanut desktop previews-low, previews-high and continuity only.' >> "$GITHUB_STEP_SUMMARY"
                  echo 'UI, battle, battle-extra, migration and common regressions are skipped, not passed by this run.' >> "$GITHUB_STEP_SUMMARY"
            # Corn's existing landscape scenario is combat-only; its seven established cases remain.
            - if: ${{ !cancelled() && steps.check.outcome == 'success' && matrix.species != 'functional' && matrix.species != 'walnut' && matrix.species != 'rice' && matrix.species != 'wheat' && matrix.species != 'chestnut' && env.FOCUSED_PEANUT_DESKTOP != 'true' && (matrix.species != 'corn' || matrix.viewport != 'landscape') }}
              run: timeout 180s npm run test:${{ matrix.species }}-growth:case -- ui ${{ matrix.viewport }}
            - if: ${{ !cancelled() && steps.check.outcome == 'success' && matrix.species != 'functional' && matrix.species != 'walnut' && matrix.species != 'rice' && matrix.species != 'wheat' && matrix.species != 'chestnut' && env.FOCUSED_PEANUT_DESKTOP != 'true' && (matrix.species != 'corn' || matrix.viewport != 'landscape') && matrix.species != 'redbean' && matrix.species != 'chestnut' && matrix.species != 'peanut' }}
              run: timeout 300s npm run test:${{ matrix.species }}-growth:case -- previews ${{ matrix.viewport }}
            - if: ${{ !cancelled() && steps.check.outcome == 'success' && matrix.species != 'functional' && matrix.species != 'walnut' && matrix.species != 'rice' && matrix.species != 'wheat' && matrix.species != 'chestnut' && env.FOCUSED_PEANUT_DESKTOP != 'true' }}
              run: timeout 180s npm run test:${{ matrix.species }}-growth:case -- battle ${{ matrix.viewport }}
            - if: ${{ !cancelled() && steps.check.outcome == 'success' && matrix.species != 'functional' && matrix.species != 'walnut' && matrix.species != 'rice' && matrix.species != 'wheat' && matrix.species != 'chestnut' && env.FOCUSED_PEANUT_DESKTOP != 'true' && matrix.species == 'pea' }}
              run: timeout 180s npm run test:pea-growth:case -- migration ${{ matrix.viewport }}
            - if: ${{ !cancelled() && steps.check.outcome == 'success' && matrix.species != 'functional' && matrix.species != 'walnut' && matrix.species != 'rice' && matrix.species != 'wheat' && matrix.species != 'chestnut' && (matrix.species == 'redbean' || matrix.species == 'peanut') }}
              run: timeout ${{ matrix.species == 'peanut' && '300s' || '180s' }} npm run test:${{ matrix.species }}-growth:case -- previews-low ${{ matrix.viewport }}
            - if: ${{ !cancelled() && steps.check.outcome == 'success' && matrix.species != 'functional' && matrix.species != 'walnut' && matrix.species != 'rice' && matrix.species != 'wheat' && matrix.species != 'chestnut' && (matrix.species == 'redbean' || matrix.species == 'peanut') }}
              run: timeout ${{ matrix.species == 'peanut' && '300s' || '180s' }} npm run test:${{ matrix.species }}-growth:case -- previews-high ${{ matrix.viewport }}
            - if: ${{ !cancelled() && steps.check.outcome == 'success' && matrix.species != 'functional' && matrix.species != 'walnut' && matrix.species != 'rice' && matrix.species != 'wheat' && matrix.species != 'chestnut' && env.FOCUSED_PEANUT_DESKTOP != 'true' && (matrix.species == 'redbean' || matrix.species == 'peanut') }}
              run: timeout 180s npm run test:${{ matrix.species }}-growth:case -- battle-extra ${{ matrix.viewport }}
            - if: ${{ !cancelled() && steps.check.outcome == 'success' && matrix.species != 'functional' && matrix.species != 'walnut' && matrix.species != 'rice' && matrix.species != 'wheat' && matrix.species != 'chestnut' && (matrix.species == 'redbean' || matrix.species == 'peanut') }}
              run: timeout 180s npm run test:${{ matrix.species }}-growth:case -- continuity ${{ matrix.viewport }}
            - if: ${{ !cancelled() && steps.check.outcome == 'success' && matrix.species != 'functional' && matrix.species != 'walnut' && matrix.species != 'rice' && matrix.species != 'wheat' && matrix.species != 'chestnut' && env.FOCUSED_PEANUT_DESKTOP != 'true' && (matrix.species == 'redbean' || matrix.species == 'peanut') }}
              run: timeout 180s npm run test:${{ matrix.species }}-growth:case -- migration ${{ matrix.viewport }}
            - name: Focused functional growth integration
              if: ${{ !cancelled() && steps.check.outcome == 'success' && matrix.species == 'functional' }}
              run: timeout 300s node tests/functional-growth.e2e.mjs ${{ matrix.viewport }}
            - name: Prepare exact functional performance baseline
              id: functional-base
              if: ${{ !cancelled() && steps.check.outcome == 'success' && matrix.species == 'functional' && matrix.viewport == 'desktop' && !contains(github.event.pull_request.labels.*.name, 'verify-browser-only') }}
              env:
                  BASE_COMMIT: 3c4debd892ca47fb4ac01165390fa591c9c38000
              run: |
                  git fetch --no-tags --depth=1 origin "$BASE_COMMIT"
                  test "$(git rev-parse FETCH_HEAD)" = "$BASE_COMMIT"
                  BASE_ROOT="$(mktemp -d /tmp/budmori-functional-base.XXXXXX)"
                  echo "root=$BASE_ROOT" >> "$GITHUB_OUTPUT"
                  git archive "$BASE_COMMIT" | tar -x -C "$BASE_ROOT"
            - name: Paired functional corn performance (both viewports)
              id: perf-corn
              if: ${{ !cancelled() && steps.functional-base.outcome == 'success' }}
              env:
                  FUNCTIONAL_GROWTH_PERFORMANCE: '1'
                  PERFORMANCE_SPECIES: corn
                  PERFORMANCE_SPLIT: '0'
                  WALNUT_PERFORMANCE_BASE_ROOT: ${{ steps.functional-base.outputs.root }}
              run: |
                  echo "scene=corn start=$(date -u +%FT%TZ) budget=1200s"
                  if timeout 1200s node tests/walnut-performance.e2e.mjs; then STATUS=0; else STATUS=$?; fi
                  echo "scene=corn end=$(date -u +%FT%TZ) exit=$STATUS"
                  echo "Performance corn exit=$STATUS" >> "$GITHUB_STEP_SUMMARY"
                  exit "$STATUS"
            - name: Preserve corn performance evidence immediately
              uses: actions/upload-artifact@v4
              if: ${{ always() && (steps.perf-corn.outcome == 'success' || steps.perf-corn.outcome == 'failure' || steps.perf-corn.outcome == 'cancelled') }}
              with:
                  name: farm-functional-perf-corn
                  path: tests/output/corn-performance/
                  if-no-files-found: error
            - name: Paired functional peanut performance (both viewports)
              id: perf-peanut
              if: ${{ !cancelled() && steps.functional-base.outcome == 'success' && !contains(github.event.pull_request.labels.*.name, 'verify-corn-render-only') && !contains(github.event.pull_request.labels.*.name, 'verify-corn-and-split') }}
              env:
                  FUNCTIONAL_GROWTH_PERFORMANCE: '1'
                  PERFORMANCE_SPECIES: peanut
                  PERFORMANCE_SPLIT: '0'
                  WALNUT_PERFORMANCE_BASE_ROOT: ${{ steps.functional-base.outputs.root }}
              run: |
                  echo "scene=peanut start=$(date -u +%FT%TZ) budget=1800s"
                  if timeout 1800s node tests/walnut-performance.e2e.mjs; then STATUS=0; else STATUS=$?; fi
                  echo "scene=peanut end=$(date -u +%FT%TZ) exit=$STATUS"
                  echo "Performance peanut exit=$STATUS" >> "$GITHUB_STEP_SUMMARY"
                  exit "$STATUS"
            - name: Preserve peanut performance evidence immediately
              uses: actions/upload-artifact@v4
              if: ${{ always() && (steps.perf-peanut.outcome == 'success' || steps.perf-peanut.outcome == 'failure' || steps.perf-peanut.outcome == 'cancelled') }}
              with:
                  name: farm-functional-perf-peanut
                  path: tests/output/peanut-performance/
                  if-no-files-found: error
            - name: Paired functional walnut performance (both viewports)
              id: perf-walnut
              if: ${{ !cancelled() && steps.functional-base.outcome == 'success' && !contains(github.event.pull_request.labels.*.name, 'verify-corn-render-only') && !contains(github.event.pull_request.labels.*.name, 'verify-corn-and-split') }}
              env:
                  FUNCTIONAL_GROWTH_PERFORMANCE: '1'
                  PERFORMANCE_SPECIES: walnut
                  PERFORMANCE_SPLIT: '0'
                  WALNUT_PERFORMANCE_BASE_ROOT: ${{ steps.functional-base.outputs.root }}
              run: |
                  echo "scene=walnut start=$(date -u +%FT%TZ) budget=1800s"
                  if timeout 1800s node tests/walnut-performance.e2e.mjs; then STATUS=0; else STATUS=$?; fi
                  echo "scene=walnut end=$(date -u +%FT%TZ) exit=$STATUS"
                  echo "Performance walnut exit=$STATUS" >> "$GITHUB_STEP_SUMMARY"
                  exit "$STATUS"
            - name: Preserve walnut performance evidence immediately
              uses: actions/upload-artifact@v4
              if: ${{ always() && (steps.perf-walnut.outcome == 'success' || steps.perf-walnut.outcome == 'failure' || steps.perf-walnut.outcome == 'cancelled') }}
              with:
                  name: farm-functional-perf-walnut
                  path: tests/output/walnut-performance/
                  if-no-files-found: error
            - name: Paired functional peanut-split performance (both viewports)
              id: perf-peanut-split
              if: ${{ !cancelled() && steps.functional-base.outcome == 'success' && !contains(github.event.pull_request.labels.*.name, 'verify-corn-render-only') }}
              env:
                  FUNCTIONAL_GROWTH_PERFORMANCE: '1'
                  PERFORMANCE_SPECIES: peanut
                  PERFORMANCE_SPLIT: '1'
                  PERFORMANCE_CONTROLLED_CLOCK: '1'
                  WALNUT_PERFORMANCE_BASE_ROOT: ${{ steps.functional-base.outputs.root }}
              run: |
                  echo "scene=peanut-split start=$(date -u +%FT%TZ) budget=3600s"
                  if timeout 3600s node tests/walnut-performance.e2e.mjs; then STATUS=0; else STATUS=$?; fi
                  echo "scene=peanut-split end=$(date -u +%FT%TZ) exit=$STATUS"
                  echo "Performance peanut-split exit=$STATUS" >> "$GITHUB_STEP_SUMMARY"
                  exit "$STATUS"
            - name: Preserve peanut-split performance evidence immediately
              uses: actions/upload-artifact@v4
              if: ${{ always() && (steps.perf-peanut-split.outcome == 'success' || steps.perf-peanut-split.outcome == 'failure' || steps.perf-peanut-split.outcome == 'cancelled') }}
              with:
                  name: farm-functional-perf-peanut-split-controlled-clock
                  path: tests/output/peanut-split-controlled-clock-performance/
                  if-no-files-found: error
            - name: Clean functional performance baseline
              if: ${{ always() && steps.functional-base.outputs.root != '' }}
              run: rm -rf -- "${{ steps.functional-base.outputs.root }}"
            - name: Focused growth inputs
              if: ${{ !cancelled() && steps.check.outcome == 'success' && (matrix.species == 'walnut' || matrix.species == 'rice' || matrix.species == 'wheat' || matrix.species == 'chestnut') }}
              run: timeout 180s node tests/${{ matrix.species }}-growth.e2e.mjs ${{ matrix.viewport }}
            - name: Focused native motion and continuity
              if: ${{ matrix.viewport != 'mobile' && !cancelled() && steps.check.outcome == 'success' && (matrix.species == 'walnut' || matrix.species == 'rice' || matrix.species == 'wheat' || matrix.species == 'chestnut') }}
              run: timeout ${{ (matrix.species == 'rice' || matrix.species == 'wheat' || matrix.species == 'chestnut') && '540s' || '360s' }} node tests/${{ matrix.species }}-motion.e2e.mjs ${{ matrix.viewport }}
            - name: Paired selected-species performance in both viewports (once)
              if: ${{ !cancelled() && steps.check.outcome == 'success' && (matrix.species == 'walnut' || matrix.species == 'rice' || matrix.species == 'wheat' || matrix.species == 'chestnut') && matrix.viewport == 'desktop' && !contains(github.event.pull_request.labels.*.name, 'verify-browser-only') }}
              env:
                  BASE_COMMIT: ${{ matrix.species == 'chestnut' && '23f65b0232472435ac8ca18bc362ebc1308a65ca' || matrix.species == 'wheat' && '76edf4868031f3b2e09f6c64c32c94a4ada745e8' || matrix.species == 'rice' && '7fac7631be682d3750beeab16981fccd83898195' || 'bde28685e3ef0dc15934cde9d41a6b9b5e42ec7f' }}
                  PERFORMANCE_SPECIES: ${{ matrix.species }}
              run: |
                  git fetch --no-tags --depth=1 origin "$BASE_COMMIT"
                  test "$(git rev-parse FETCH_HEAD)" = "$BASE_COMMIT"
                  BASE_ROOT="$(mktemp -d /tmp/budmori-walnut-base.XXXXXX)"
                  trap 'rm -rf -- "$BASE_ROOT"' EXIT
                  git archive "$BASE_COMMIT" | tar -x -C "$BASE_ROOT"
                  WALNUT_PERFORMANCE_BASE_ROOT="$BASE_ROOT" timeout 960s node tests/walnut-performance.e2e.mjs
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: farm-browser-${{ matrix.species }}-${{ matrix.viewport }}
                  path: |
                      tests/output/${{ matrix.species }}-growth/
                      tests/output/${{ matrix.species }}-motion/
                      tests/output/${{ matrix.species }}-performance/
                      tests/output/browser-setup/
                  if-no-files-found: error
    # The focus label alone does not opt into common regressions; verify-gameplay keeps full coverage.
    regression:
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.regression) || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'verify-gameplay') && (github.event.action != 'labeled' || github.event.label.name == 'verify-gameplay' || github.event.label.name == 'verify-peanut-desktop')) }}
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - uses: actions/cache@v4
              id: playwright-cache
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-ubuntu-24.04-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
            - name: Install official Chromium OS dependencies (timed)
              run: |
                  mkdir -p tests/output/browser-setup
                  echo "runner=${ImageOS} image=${ImageVersion} arch=$(uname -m) cache=${{ steps.playwright-cache.outputs.cache-hit }}" > tests/output/browser-setup/setup.txt
                  echo "dependencies_start=$(date -u +%FT%TZ)" >> tests/output/browser-setup/setup.txt
                  ./node_modules/.bin/playwright install-deps chromium
                  echo "dependencies_end=$(date -u +%FT%TZ)" >> tests/output/browser-setup/setup.txt
                  dpkg-query -W fonts-freefont-ttf fonts-ipafont-gothic fonts-wqy-zenhei libnss3 xvfb >> tests/output/browser-setup/setup.txt
            - name: Install exact pinned Chromium (timed, including partial cache)
              run: |
                  echo "browser_start=$(date -u +%FT%TZ)" >> tests/output/browser-setup/setup.txt
                  ./node_modules/.bin/playwright install chromium
                  echo "browser_end=$(date -u +%FT%TZ)" >> tests/output/browser-setup/setup.txt
                  node --input-type=module -e "import {chromium} from 'playwright'; import {execFileSync} from 'node:child_process'; console.log(execFileSync(chromium.executablePath(), ['--version'], {encoding:'utf8'}));" >> tests/output/browser-setup/setup.txt
                  ./node_modules/.bin/playwright --version >> tests/output/browser-setup/setup.txt
            - id: check
              run: npm run check
            - if: ${{ !cancelled() && steps.check.outcome == 'success' }}
              run: timeout 180s npm run test:breed-allocation
            - if: ${{ !cancelled() && steps.check.outcome == 'success' }}
              run: timeout 180s npm test
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: farm-browser-regression
                  path: |
                      tests/output/breed-allocation/
                      tests/output/browser-setup/
                  if-no-files-found: error
