name: Farm source checks
on:
    pull_request:
    push:
        branches: [main]
permissions:
    contents: read
jobs:
    checks:
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run check
            - name: Preserve HUD sampling and authored render bounds
              run: |
                  timeout 180s npm run test:hud-counts
                  timeout 180s npm run test:render-bounds
            - uses: actions/cache@v4
              id: playwright-cache
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-ubuntu-24.04-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
            - name: Install official Chromium OS dependencies (timed)
              run: |
                  set -o pipefail
                  mkdir -p tests/output/browser-setup
                  echo "runner=${ImageOS} image=${ImageVersion} arch=$(uname -m) cache=${{ steps.playwright-cache.outputs.cache-hit }}" > tests/output/browser-setup/setup.txt
                  echo "dependencies_start=$(date -u +%FT%TZ)" >> tests/output/browser-setup/setup.txt
                  ./node_modules/.bin/playwright install-deps chromium 2>&1 | tee tests/output/browser-setup/dependencies.log
                  echo "dependencies_end=$(date -u +%FT%TZ)" >> tests/output/browser-setup/setup.txt
                  dpkg-query -W fonts-freefont-ttf fonts-ipafont-gothic fonts-wqy-zenhei libnss3 xvfb >> tests/output/browser-setup/setup.txt
            - name: Install exact pinned Chromium (timed, including partial cache)
              run: |
                  set -o pipefail
                  echo "browser_start=$(date -u +%FT%TZ)" >> tests/output/browser-setup/setup.txt
                  ./node_modules/.bin/playwright install chromium 2>&1 | tee tests/output/browser-setup/chromium-install.log
                  echo "browser_end=$(date -u +%FT%TZ)" >> tests/output/browser-setup/setup.txt
                  node --input-type=module -e "import {chromium} from 'playwright'; import {execFileSync} from 'node:child_process'; console.log(execFileSync(chromium.executablePath(), ['--version'], {encoding:'utf8'}));" >> tests/output/browser-setup/setup.txt
                  ./node_modules/.bin/playwright --version >> tests/output/browser-setup/setup.txt
            - name: Boot the unbuilt source once
              run: timeout 120s npm run test:source-smoke
            - name: Prepare immutable pre-optimization render baseline
              run: |
                  git fetch --no-tags --depth=1 origin 881fd7c9b97efc00ca2e2a46c1ee5b069f7ccdfe
                  mkdir -p ../baseline
                  git archive 881fd7c9b97efc00ca2e2a46c1ee5b069f7ccdfe | tar -x -C ../baseline
            - name: Preserve native HUD interpolation through roster changes
              if: success() || failure()
              run: timeout 180s npm run test:hud-sampling
            - name: Preserve retreat contacts at expanded walls with multiple bosses
              if: success() || failure()
              run: |
                  timeout 180s npm run test:contact-boundaries -- ../baseline 250 wall
                  timeout 180s npm run test:contact-boundaries -- ../baseline 500 corner
            - name: Compare boundary and re-entry pixels at all viewport shapes
              if: success() || failure()
              run: |
                  for viewport in desktop portrait landscape; do
                    timeout 180s npm run test:render-visibility -- "$viewport" || exit $?
                  done
            - name: Play the tower army flow
              if: success() || failure()
              run: timeout 180s npm run test:tower-army
            - name: Inspect farm and battlefield with desktop gestures
              if: success() || failure()
              run: timeout 180s npm run test:camera -- desktop
            - name: Inspect farm and battlefield with portrait touch gestures
              if: success() || failure()
              run: timeout 180s npm run test:camera -- portrait
            - name: Inspect farm and battlefield with landscape touch gestures
              if: success() || failure()
              run: timeout 180s npm run test:camera -- landscape
            - name: Preserve default meteor framing and manual camera control
              if: success() || failure()
              run: timeout 180s npm run test:corn-growth:case -- battle landscape
            - name: Compare visible scatter at maximum frontline
              if: success() || failure()
              run: timeout 180s npm run test:scatter-command -- 500 1 center
            - name: Verify scatter commands and reserve joins
              if: success() || failure()
              run: timeout 180s npm run test:scatter-command -- 100 1 center
            - name: Compare maximum frontline at the expanded wall
              if: success() || failure()
              run: timeout 180s npm run test:scatter-command -- 500 1 wall
            - name: Verify sustained scatter attack participation (100)
              if: success() || failure()
              run: timeout 180s npm run test:scatter-participation -- 100
            - name: Verify sustained scatter attack participation (500)
              if: success() || failure()
              run: timeout 180s npm run test:scatter-participation -- 500
            - name: Include recorded paired measurement JSON for independent review
              if: always()
              run: |
                  python3 -m zipfile -e docs/validation/performance-0.42.3-raw.zip tests/output/recorded-performance
                  cp docs/validation/performance-0.42.3.json tests/output/recorded-performance/manifest.json
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: farm-source-smoke
                  path: |
                      tests/output/source-smoke/
                      tests/output/browser-setup/
                      tests/output/tower-army/
                      tests/output/battle-camera/
                      tests/output/corn-growth/
                      tests/output/scatter-command/
                      tests/output/scatter-participation/
                      tests/output/render-visibility/
                      tests/output/hud-sampling/
                      tests/output/contact-performance/*-boundaries.json
                      tests/output/recorded-performance/
                  if-no-files-found: warn
